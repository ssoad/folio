# Same as docker-compose.yml, but secrets come from files instead of
# folio.env. Create them first, e.g.:
#
#   openssl rand -hex 32 > pro_token_key.txt
#   openssl rand -hex 24 > my_secret.txt         # file-server password
#
#   docker compose -f docker-compose-secret.yml up -d
services:
  folio:
    image: ghcr.io/ssoad/folio:latest
    container_name: folio
    restart: unless-stopped
    env_file:
      - path: folio.env
        required: false
    ports:
      - "${FOLIO_PORT:-80}:80"
    volumes:
      - ./folio-data/data:/app/data
      - ./folio-data/assets:/app/assets
      - ./folio-data/uploads:/app/uploads
    secrets:
      - pro_token_key
      - my_secret

secrets:
  # Encrypts saved data-source credentials (PRO_TOKEN_KEY)
  pro_token_key:
    file: ./pro_token_key.txt
  # File-server password (SERVER_PASSWORD), used when ENABLE_HTTP_SERVER=true
  my_secret:
    file: ./my_secret.txt
