# Folio: the web app and the Folio server in one container.
#
#   cp folio.env.example folio.env    # then edit it
#   docker compose up -d --build
#
# Open http://localhost for the web app and http://localhost/admin for the
# admin panel (the first-admin setup code is in `docker compose logs folio`).
# In the desktop or Android app, set Settings → Server to the same address.
#
# Optional local AI services, started with their profile:
#   docker compose --profile tts up -d   # Kokoro voices   → PRO_TTS_BASE_URL=http://kokoro:8880/v1
#   docker compose --profile ai up -d    # Ollama models   → PRO_AI_BASE_URL=http://ollama:11434/v1

services:
  folio:
    build: .
    image: ghcr.io/ssoad/folio:latest
    container_name: folio
    restart: unless-stopped
    env_file:
      - path: folio.env
        required: false
    ports:
      # Web app, plus the server (/pro, /admin, /opds, file server) behind it
      - "${FOLIO_PORT:-80}:80"
      # KOReader progress sync, when ENABLE_KOREADER_SERVER=true
      # - "7200:7200"
    volumes:
      # Accounts database: users, packages, promo codes, settings. Back it up.
      - ./folio-data/data:/app/data
      # Fonts, dictionaries and backgrounds the app can download
      - ./folio-data/assets:/app/assets
      # Books and sync data of the file server (ENABLE_HTTP_SERVER=true)
      - ./folio-data/uploads:/app/uploads

  kokoro:
    profiles: ["tts"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: folio-kokoro
    restart: unless-stopped

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: folio-ollama
    restart: unless-stopped
    volumes:
      - ./folio-data/ollama:/root/.ollama
