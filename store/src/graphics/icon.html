<!doctype html>
<!-- Google Play icon, 512 x 512: full bleed (Play rounds the corners and
     adds the shadow itself), the Folio mark within the safe area. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 512px;
        height: 512px;
        overflow: hidden;
      }
      .icon {
        position: relative;
        width: 512px;
        height: 512px;
        background:
          radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.22), transparent 55%),
          radial-gradient(circle at 85% 95%, rgba(20, 24, 70, 0.45), transparent 60%),
          linear-gradient(150deg, #5b6ce6 0%, #4458c7 48%, #3443a8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      svg {
        width: 300px;
        height: 300px;
        filter: drop-shadow(0 18px 26px rgba(16, 20, 64, 0.35));
      }
    </style>
  </head>
  <body>
    <div class="icon">
      <!-- The mark's geometry (src/components/folioLogo): a page with its
           corner folded, its lines of text forming an F -->
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M14 6h26l14 14v34a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z" fill="#ffffff" />
        <path d="M40 6v10a4 4 0 0 0 4 4h10z" fill="#c7ceff" />
        <rect x="19" y="26" width="24" height="5" rx="2.5" fill="#4458c7" />
        <rect x="19" y="36" width="16" height="5" rx="2.5" fill="#4458c7" />
        <rect x="19" y="26" width="5" height="22" rx="2.5" fill="#4458c7" />
      </svg>
    </div>
  </body>
</html>
