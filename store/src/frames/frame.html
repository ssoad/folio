<!doctype html>
<!-- One store screenshot: headline and subline over a soft aurora, the real
     app screen in a device frame. frame.html#<index into shots.js>. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Newsreader";
        src: url("../../../node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2") format("woff2");
        font-weight: 200 800;
      }
      @font-face {
        font-family: "Geist";
        src: url("../../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --ground: #f7f6f3;
        --text: #1c1b19;
        --muted: #5f5e59;
        --accent: #4458c7;
        --bezel: #16161a;
      }
      .dark {
        --ground: #121211;
        --text: #f1f0ec;
        --muted: #a6a59f;
        --accent: #8c9bff;
        --bezel: #2a2a2e;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      .canvas {
        position: relative;
        overflow: hidden;
        background: var(--ground);
        color: var(--text);
        font-family: "Geist", system-ui, sans-serif;
      }
      .aurora {
        position: absolute;
        inset: -10%;
        filter: blur(90px);
        opacity: 0.55;
      }
      .dark .aurora {
        opacity: 0.5;
      }
      .aurora span {
        position: absolute;
        border-radius: 50%;
      }
      .a1 {
        width: 70%;
        height: 50%;
        left: -10%;
        top: -5%;
        background: radial-gradient(circle, #6d7cf6, transparent 65%);
      }
      .a2 {
        width: 60%;
        height: 45%;
        right: -15%;
        top: 25%;
        background: radial-gradient(circle, #f2a65a, transparent 65%);
        opacity: 0.75;
      }
      .a3 {
        width: 70%;
        height: 45%;
        left: 5%;
        bottom: -15%;
        background: radial-gradient(circle, #e8668f, transparent 65%);
        opacity: 0.55;
      }
      .copy {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        padding: 0 72px;
      }
      h1 {
        margin: 0;
        font-family: "Newsreader", Georgia, serif;
        font-weight: 600;
        font-variation-settings: "opsz" 72;
        letter-spacing: -0.035em;
        line-height: 1.02;
        white-space: pre-line;
        text-wrap: balance;
      }
      p {
        margin: 0 auto;
        color: var(--muted);
        line-height: 1.35;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .device {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bezel);
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.06) inset,
          0 50px 90px -30px rgba(0, 0, 0, 0.45),
          0 18px 36px -18px rgba(0, 0, 0, 0.35);
      }
      .screen {
        position: relative;
        overflow: hidden;
        background: #000;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        font-weight: 600;
      }
      .status svg {
        display: block;
      }
      .shot {
        display: block;
        width: 100%;
      }
      .camera {
        position: absolute;
        left: 50%;
        border-radius: 50%;
        background: #050505;
        transform: translateX(-50%);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
      }
    </style>
    <script src="shots.js"></script>
    <script src="../../build/raw/colors.js"></script>
  </head>
  <body>
    <div class="canvas" id="canvas">
      <div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
      <div class="copy" id="copy"><h1 id="title"></h1><p id="sub"></p></div>
      <div class="device" id="device">
        <div class="screen" id="screen">
          <div class="status" id="status">
            <span id="time">9:41</span>
            <span id="icons"></span>
          </div>
          <img class="shot" id="shot" />
        </div>
      </div>
    </div>
    <script>
      const shot = window.SHOTS[Number(location.hash.slice(1)) || 0];
      const d = window.DEVICES[shot.device];
      const isPhone = shot.device === "phone";
      const isWide = shot.device === "tablet10";
      const canvas = document.getElementById("canvas");
      canvas.style.width = d.w + "px";
      canvas.style.height = d.h + "px";
      if (shot.theme === "dark") canvas.classList.add("dark");

      // Words: two lines on tall canvases, one on the wide tablet
      const title = document.getElementById("title");
      const sub = document.getElementById("sub");
      title.textContent = shot.title;
      sub.textContent = shot.sub;
      const copy = document.getElementById("copy");
      if (isPhone) {
        copy.style.top = "92px";
        title.style.fontSize = "88px";
        sub.style.fontSize = "36px";
        sub.style.marginTop = "26px";
        sub.style.maxWidth = "820px";
      } else if (isWide) {
        copy.style.top = "52px";
        title.style.fontSize = "72px";
        sub.style.fontSize = "32px";
        sub.style.marginTop = "14px";
      } else {
        copy.style.top = "84px";
        title.style.fontSize = "92px";
        sub.style.fontSize = "36px";
        sub.style.marginTop = "24px";
        sub.style.maxWidth = "860px";
      }

      // Device and screen
      const device = document.getElementById("device");
      device.style.top = d.top + "px";
      device.style.padding = d.bezel + "px";
      device.style.borderRadius = d.radius + "px";
      const screen = document.getElementById("screen");
      screen.style.width = d.screen + "px";
      screen.style.borderRadius = d.radius - d.bezel + "px";

      // The status bar takes the colour of the app's top edge
      const edge = (window.RAW_COLORS || {})[shot.raw] || "#ffffff";
      const [r, g, b] = edge.match(/\w\w/g).map((x) => parseInt(x, 16));
      const ink = 0.299 * r + 0.587 * g + 0.114 * b > 150 ? "#1c1b19" : "#f1f0ec";
      const status = document.getElementById("status");
      status.style.height = d.status + "px";
      status.style.background = edge;
      status.style.color = ink;
      status.style.fontSize = Math.round(d.status * 0.5) + "px";
      status.style.padding = `0 ${Math.round(d.status * 0.9)}px 0 ${Math.round(d.status * 1.0)}px`;
      const s = Math.round(d.status * 0.42);
      document.getElementById("icons").innerHTML = `
        <svg width="${s * 4.6}" height="${s}" viewBox="0 0 46 10" fill="${ink}">
          <path d="M1 9 L5 9 L5 6 L1 6 Z M7 9 L11 9 L11 4 L7 4 Z M13 9 L17 9 L17 2 L13 2 Z" opacity=".95"/>
          <path d="M22 4.2 a7 7 0 0 1 10 0 l-1.3 1.3 a5.2 5.2 0 0 0 -7.4 0 Z M24.4 6.6 a3.6 3.6 0 0 1 5.2 0 L27 9.2 Z" />
          <rect x="35" y="1" width="9.5" height="8" rx="2" fill="none" stroke="${ink}" stroke-width="1.2"/>
          <rect x="36.5" y="2.5" width="6.5" height="5" rx="1"/>
          <rect x="44.8" y="3.6" width="1.2" height="2.8" rx=".6"/>
        </svg>`;
      // A hole-punch camera on phones
      if (isPhone) {
        const cam = document.createElement("span");
        cam.className = "camera";
        cam.style.top = Math.round(d.status * 0.24) + "px";
        cam.style.width = cam.style.height = Math.round(d.status * 0.52) + "px";
        screen.appendChild(cam);
      }
      document.getElementById("shot").src = "../../build/raw/" + shot.raw + ".png";
    </script>
  </body>
</html>
